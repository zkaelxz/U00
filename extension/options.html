<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baihe Subtitler — options</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 560px; margin: 32px auto; padding: 0 16px;
           font: 14px/1.6 "Segoe UI", system-ui, sans-serif; }
    h1 { font-size: 18px; }
    label { display: block; margin: 18px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    button { margin-top: 14px; padding: 8px 16px; font: inherit; cursor: pointer; }
    #status { margin-top: 14px; padding: 10px; border-radius: 6px;
              background: rgba(127,127,127,0.14); }
    #status.bad { background: rgba(200,60,60,0.18); }
    .muted { opacity: 0.8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Baihe Subtitler</h1>
  <p class="muted">This extension only ever talks to Baihe running on this computer
    (<code>127.0.0.1</code>). The token below is what stops any other page in your browser
    from sending things to it, so treat it like a password.</p>

  <label for="token">Token</label>
  <input type="password" id="token" autocomplete="off"
         placeholder="Paste from Baihe → Settings → Browser extension">

  <label for="port">Port</label>
  <input type="number" id="port" min="1" max="65535" value="8756">

  <button id="save">Save and test</button>
  <div id="status">Not checked yet.</div>

  <script src="options.js"></script>
</body>
</html>
