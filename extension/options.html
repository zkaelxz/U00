<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baihe Subtitler — options</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 32px 16px; }
    main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
           padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    #save { align-self: flex-start; }
  </style>
</head>
<body>
  <main>
    <h1>Baihe Subtitler</h1>
    <p class="hint">This extension only talks to Baihe on this computer
      (<code>127.0.0.1:8756</code>, with the Extension bridge switch on in Settings → Browser extension).
      The token stops other pages in your browser from using it, so treat it like a password.</p>
    <div>
      <label for="token">Token</label>
      <input type="password" id="token" autocomplete="off"
             placeholder="Paste from Baihe → Settings → Browser extension">
    </div>
    <button id="save" class="primary" type="button">Save and test</button>
    <p id="status" class="status" role="status" aria-live="polite">Not checked yet.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
