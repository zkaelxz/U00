<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baihe Subtitler</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 14px; }
    main { display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    section { display: flex; flex-direction: column; gap: 10px; }
    .quiet { padding-top: 14px; border-top: 1px solid var(--border); }
    .switches { display: flex; flex-direction: column; gap: 2px; }
    .switch { display: flex; align-items: center; gap: 10px; min-height: 36px; margin: 0; font-weight: 400; cursor: pointer; }
    .switch input { appearance: none; flex: none; width: 36px; height: 20px; margin: 0; cursor: pointer;
                    border-radius: 999px; background: var(--surface-2); border: 1px solid var(--field-edge);
                    position: relative; }
    .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
                           border-radius: 50%; background: var(--muted); }
    .switch input:checked { background: var(--accent); border-color: var(--accent); }
    .switch input:checked::after { left: 18px; background: var(--on-accent); }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #translate { width: 100%; min-height: 44px; }
    #translateText { width: 100%; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header><h1>Baihe Subtitler</h1></header>

    <div id="notice" class="notice" role="alert" hidden>
      <p id="noticeText"></p>
      <button id="noticeAction" class="primary" type="button"></button>
    </div>

    <section id="pageSection" aria-label="Translate this page">
      <div>
        <label for="drama">Send pages to</label>
        <select id="drama"><option value="">— pick a drama —</option></select>
      </div>
      <div class="switches">
        <label class="switch"><input type="checkbox" role="switch" id="store" checked><span>Save page into drama</span></label>
        <label class="switch"><input type="checkbox" role="switch" id="overlay" checked><span>Draw over page</span></label>
      </div>
      <button id="translate" class="primary" type="button">Translate this page</button>
      <div class="segmented">
        <button id="translateAll" type="button">Everything visible</button>
        <button id="toggle" type="button">Show / hide</button>
      </div>
      <div class="segmented">
        <button id="captureChapter" type="button">Capture whole chapter</button>
        <button id="captureFromHere" type="button">Capture from here</button>
      </div>
      <button id="cancelCapture" type="button" hidden>Cancel capture</button>
    </section>

    <section id="textSection" class="quiet" aria-label="Translate selected text">
      <h2>Translate selected text</h2>
      <div>
        <label for="textDirection">Languages</label>
        <select id="textDirection">
          <option value="zh:en">Chinese → English</option>
          <option value="ja:en">Japanese → English</option>
          <option value="ko:en">Korean → English</option>
          <option value="en:zh">English → Chinese</option>
          <option value="en:ja">English → Japanese</option>
          <option value="en:ko">English → Korean</option>
        </select>
      </div>
      <button id="translateText" type="button">Translate text</button>
      <p class="hint">Uses your selection, or the page's main text. Saved to Standalone translate history.</p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Checking the app…</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
