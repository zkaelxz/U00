<html><body><div class='content contentmargin'><p>午后天色忽然暗了下来，乌云压在山顶。</p><p>林舟找到一处岩洞，刚躲进去，大雨便倾盆而下。</p><p>洞里比外面暖和许多，角落里似乎有人生过火。</p><p>他蹲下来摸了摸灰烬，还有一点余温。</p><p>“有人在吗？”他的声音在洞里回荡。</p><p>远处的钟声响了三下，谁也没有再说话。</p><p>远处的钟声响了三下，日子似乎又慢了下来。</p><p>远处的钟声响了三下，仿佛什么都没有发生过。</p><p>远处的钟声响了三下，他忽然想起了小时候的事。</p><p>炉子上的水壶咕嘟作响，他停下脚步想了很久。</p><p>炉子上的水壶咕嘟作响，她轻轻叹了一口气。</p><p>炉子上的水壶咕嘟作响，谁也没有再说话。</p><p>炉子上的水壶咕嘟作响，日子似乎又慢了下来。</p></div><div class='pagination2'><a href='/xiandai/20_b/bkTest.html'>目录</a><a href='/xiandai/20_b/bkTest_1.html'>上一页</a><a href='/xiandai/20_b/bkTest_3.html'>下一页</a></div></body></html>
