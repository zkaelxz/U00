<?xml version="1.0" encoding="shift_jis"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>ch1</title><style>p{text-indent:2em}</style></head><body><h2>第1話　はじまり</h2><p><img src="illust1.png" alt=""/></p><p>朝の光がカーテンの隙間から差し込んでいた。</p><p><ruby>妹<rp>(</rp><rt>いもうと</rt><rp>)</rp></ruby>はまだ眠っている。起こすのはもう少し後にしよう。</p><p>「おはよう、お兄ちゃん」</p><p>振り返ると、<ruby>妹<rp>(</rp><rt>いもうと</rt><rp>)</rp></ruby>が眠そうな目をこすっていた。</p><p>窓の外で風が鳴った。誰も何も言わなかった。</p><p>窓の外で風が鳴った。少しだけ胸が痛んだ。</p><p>窓の外で風が鳴った。それでも前に進むしかない。</p><p>窓の外で風が鳴った。時間がゆっくりと流れていく。</p><p>時計の針が三時を指した。誰も何も言わなかった。</p><p>時計の針が三時を指した。少しだけ胸が痛んだ。</p></body></html>
