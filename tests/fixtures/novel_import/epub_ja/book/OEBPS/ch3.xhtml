<?xml version="1.0" encoding="shift_jis"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>ch3</title><style>p{text-indent:2em}</style></head><body><h2>第3話　放課後</h2><p>放課後の<ruby>図書室<rp>(</rp><rt>としょしつ</rt><rp>)</rp></ruby>は静かだった。</p><p>窓際の席で、見慣れない<ruby>少女<rp>(</rp><rt>しょうじょ</rt><rp>)</rp></ruby>が本を読んでいる。</p><p>彼女は顔を上げ、小さく会釈した。</p><p>夕焼けが部屋を赤く染めた。誰も何も言わなかった。</p><p>夕焼けが部屋を赤く染めた。少しだけ胸が痛んだ。</p><p>夕焼けが部屋を赤く染めた。それでも前に進むしかない。</p><p>夕焼けが部屋を赤く染めた。時間がゆっくりと流れていく。</p><p>遠くで電車の音が聞こえた。誰も何も言わなかった。</p><p>遠くで電車の音が聞こえた。少しだけ胸が痛んだ。</p></body></html>
