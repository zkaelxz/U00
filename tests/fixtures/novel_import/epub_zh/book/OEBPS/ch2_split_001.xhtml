<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>ch2b</title><style>p{text-indent:2em}</style></head><body><p>远处的钟声响了三下，日子似乎又慢了下来。</p><p>远处的钟声响了三下，仿佛什么都没有发生过。</p><p>远处的钟声响了三下，他忽然想起了小时候的事。</p><p>炉子上的水壶咕嘟作响，他停下脚步想了很久。</p><p>炉子上的水壶咕嘟作响，她轻轻叹了一口气。</p><p>炉子上的水壶咕嘟作响，谁也没有再说话。</p><p>炉子上的水壶咕嘟作响，日子似乎又慢了下来。</p></body></html>
