<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>ch2</title><style>p{text-indent:2em}</style></head><body><h2>第二章 山雨</h2><p>午后天色忽然暗了下来，乌云压在山顶。</p><p>林舟找到一处岩洞，刚躲进去，大雨便倾盆而下。</p><p>洞里比外面暖和许多，角落里似乎有人生过火。</p><p>他蹲下来摸了摸灰烬，还有一点余温。</p><p>“有人在吗？”他的声音在洞里回荡。</p><p>远处的钟声响了三下，谁也没有再说话。</p></body></html>
