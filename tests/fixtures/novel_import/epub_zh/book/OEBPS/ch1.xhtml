<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>ch1</title><style>p{text-indent:2em}</style></head><body><h2>第一章 初见</h2><p>清晨的雾气还没有散去，小镇的石板路上湿漉漉的。</p><p>林舟背着竹篓走出家门，远处传来卖豆腐的吆喝声。</p><p>“今天要去山里吗？”隔壁的王婶探出头来问。</p><p>他点点头，笑着说：“去采些草药，晚上就回来。”</p><p>山路比想象中难走，露水打湿了他的裤脚。</p><p>风从山谷里吹过来，他停下脚步想了很久。</p><p>风从山谷里吹过来，她轻轻叹了一口气。</p><p>风从山谷里吹过来，谁也没有再说话。</p><p>风从山谷里吹过来，日子似乎又慢了下来。</p><p>风从山谷里吹过来，仿佛什么都没有发生过。</p><p>风从山谷里吹过来，他忽然想起了小时候的事。</p><p>远处的钟声响了三下，他停下脚步想了很久。</p><p>远处的钟声响了三下，她轻轻叹了一口气。</p></body></html>
