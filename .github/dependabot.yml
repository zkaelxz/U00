version: 2

# Dependabot only opens PRs; nothing here merges. Each ecosystem is grouped
# into one weekly PR so a week of bumps is one CI run to review, and the low
# open-PR limit keeps an unattended repo from piling up stale branches.
updates:
  # The tiered requirements files live at the repo root; constraints.txt is
  # read alongside them, so both are scanned from the same directory.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
    # torch, torchaudio and ctranslate2 move only after the tests plus one transcription on a real GPU.
    ignore:
      - dependency-name: torch
      - dependency-name: torchaudio
      - dependency-name: ctranslate2

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns: ["*"]

  # The pinned generator for frontend/src/api/generated/schema.d.ts.
  - package-ecosystem: npm
    directory: /frontend/openapi-gen
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      openapi-gen-dependencies:
        patterns: ["*"]

  # The Caddy build for the installer's remote-access service.
  - package-ecosystem: gomod
    directory: /installer/caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        patterns: ["*"]

  # The Android shell app.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      gradle-dependencies:
        patterns: ["*"]

  # Workflows pin actions by commit SHA with a version comment; Dependabot
  # updates both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
