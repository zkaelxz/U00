name: Windows Bootstrap

# Step 10b: automates the one piece of Step 10's manual-check list that's
# actually automatable -- does start.bat correctly bootstrap (venv, deps,
# dependency check, server reachable) on a machine that's never run this
# before. Runs the real start.bat (via its --ci flag), on a fresh
# checkout, so it automatically tracks whatever that script does next
# rather than a separate, hand-maintained copy of today's steps. Kept as
# its own workflow (alongside, not replacing, tests.yml's ubuntu-latest
# job) so it only runs when something that could actually change this
# bootstrap changes.
#
# What this does NOT cover -- needs a person at a real screen instead:
# the desktop-window/Edge-app-mode behavior, the shortcut's icon, and
# uninstall.bat's interactive prompts.
on:
  push:
    branches: [baihe-subtitler]
    paths:
      - start.bat
      - requirements-core.txt
      - constraints.txt
      - check_setup.py
      - "api/**"
      - "frontend/**"
      - .github/workflows/windows-bootstrap.yml
  pull_request:
    branches: [baihe-subtitler]
    paths:
      - start.bat
      - requirements-core.txt
      - constraints.txt
      - check_setup.py
      - "api/**"
      - "frontend/**"
      - .github/workflows/windows-bootstrap.yml

# Cancel a still-running CI run for the same branch/PR once a newer push
# supersedes it -- checked safe: this repo has no deployment/release
# workflow whose in-flight run a cancellation could interrupt, just this
# and tests.yml's own validation workflow, so there's nothing here a
# mid-run cancel loses. windows-latest runners bill at a 2x multiplier
# (see CLAUDE.md's GitHub Actions minutes section), so a superseded run
# here is worth cancelling promptly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real observed duration (GitHub Actions run history, 2026-09-28, 6
  # runs): consistently ~1m08s-1m20s before the frontend build was added
  # (npm ci + build adds a few minutes). 15 minutes gives real headroom for
  # slower Windows-runner provisioning/startup without leaving a hung
  # `start.bat --ci` (which, unfixed, would otherwise wait on a server
  # that never answers) to run indefinitely on the more expensive runner.
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Built before start.bat so `python -m api` serves it. The Windows
      # build is what catches filename-case collisions (2026-09-29), and the
      # served bundle's Content-Type is checked below (Windows' registry
      # maps .js to text/plain, which left the app window blank).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run start.bat --ci
        shell: cmd
        run: start.bat --ci

      # start.bat --ci already waits for /api/health (`python -m api`);
      # this re-checks it independently.
      - name: Health check -- confirm /api/health answers
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri http://127.0.0.1:8600/api/health -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            Write-Error "Server responded with $($response.StatusCode), expected 200"
            exit 1
          }
          Write-Host "/api/health answered on port 8600 with status $($response.StatusCode)"

      - name: Frontend check -- the JS bundle is served as JavaScript
        shell: pwsh
        run: |
          $index = Invoke-WebRequest -Uri http://127.0.0.1:8600/ -UseBasicParsing
          if ($index.Headers['Content-Type'] -notlike 'text/html*') {
            Write-Error "/ served as '$($index.Headers['Content-Type'])', expected text/html"
            exit 1
          }
          $m = [regex]::Match($index.Content, '/assets/[^"'']+\.js')
          if (-not $m.Success) { Write-Error "No /assets/*.js in index.html"; exit 1 }
          $js = Invoke-WebRequest -Uri ("http://127.0.0.1:8600" + $m.Value) -UseBasicParsing
          $ctype = [string]$js.Headers['Content-Type']
          if (-not ($ctype.StartsWith('text/javascript') -or $ctype.StartsWith('application/javascript'))) {
            Write-Error "$($m.Value) served as '$ctype', expected a JavaScript type"
            exit 1
          }
          Write-Host "$($m.Value) served as $ctype"
