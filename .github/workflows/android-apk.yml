name: Android APK

# Builds the debug APK of the Android app (android/) and runs its unit tests.
# The build runs on demand only, never on every PR: the app is not part of the
# server's tests. The wrapper check also runs on any PR that changes the
# wrapper, because gradle-wrapper.jar is a binary nobody can review in a diff
# and it runs on the PC whenever the app is built there.
# Without the ANDROID_DEBUG_KEYSTORE_BASE64 secret the debug build is signed with
# the runner's throwaway debug key: it can be sideloaded but no phone accepts it
# as an update to an app signed with another key, so it is not published.
# With the secret (a debug.keystore file, base64), the same key signs every run,
# and the publish job puts the APK on the rolling "android-app" pre-release that
# Settings > App updates > "Get the newest phone app" fetches. The secret is
# read only by the build job of a manual run; the publish job checks out and
# runs nothing from the repository.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/gradle/wrapper/**"
      - "**/gradle-wrapper.jar"
      - "android/gradlew"
      - "android/gradlew.bat"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Compares every gradle-wrapper.jar with Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

  apk:
    if: github.event_name == 'workflow_dispatch'
    needs: wrapper
    outputs:
      publish: ${{ steps.key.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The debug build type signs with ~/.android/debug.keystore, so restoring the
      # owner's keystore there keeps one signing key across runs and PCs.
      - name: Restore the signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not published::ANDROID_DEBUG_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and is not offered to phones."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # ubuntu-latest ships JDK 17 and the Android SDK (ANDROID_HOME). The version
      # code must beat every build already on a phone; hand-built ones count up
      # from 1, so the run number is lifted well above them.
      - name: Unit tests and debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lint -PbaiheVersionCode=$((1000 + RUN_NUMBER))

      - name: Stage the files the server fetches
        if: steps.key.outputs.publish == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir stage
          cp android/app/build/outputs/apk/debug/app-debug.apk stage/baihe-shell.apk
          printf '%s' "$((1000 + RUN_NUMBER))" > stage/baihe-shell.version
          (cd stage && sha256sum baihe-shell.apk > baihe-shell.apk.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: baihe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.key.outputs.publish == 'true'
        with:
          name: baihe-android-publish
          path: stage/
          if-no-files-found: error

  # Write access lives only here; nothing from the repository runs in this job.
  publish:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && needs.apk.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: android-publish
    steps:
      - name: Put the build on the android-app pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name baihe-android-publish --dir out
          version="$(cat out/baihe-shell.version)"
          echo "App build $version sha256 $(cut -d ' ' -f 1 out/baihe-shell.apk.sha256)"
          if ! gh release view android-app --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A tag that does not start with "v" and a pre-release: the installer updater never offers it.
            gh release create android-app --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Android app (latest build)" \
              --notes "Rolling release. The APK, its SHA-256 and its version code are replaced by each run of the Android APK workflow; Settings > App updates > Get the newest phone app fetches them."
          fi
          gh release upload android-app out/baihe-shell.apk out/baihe-shell.apk.sha256 out/baihe-shell.version \
            --repo "$GITHUB_REPOSITORY" --clobber
