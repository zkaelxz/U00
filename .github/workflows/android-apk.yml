name: Android APK

# Builds the debug APK of the Android app (android/) and runs its unit tests.
# On demand only, never on every PR: the app is not part of the server's tests.
# The debug build is signed with Android's throwaway debug key, so it can be
# sideloaded but is not an update path for a release build. No signing key or
# other secret is read here; a release key would be a repository secret added
# in a separate, reviewed change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest ships JDK 17 and the Android SDK (ANDROID_HOME).
      - name: Unit tests and debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lint

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: baihe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
