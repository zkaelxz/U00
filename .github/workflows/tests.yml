name: Tests

# Runs the test suite against a core-only install: requirements-core.txt
# plus pytest, nothing else. Optional-dependency tests (cv2/pytesseract/
# jieba, etc.) already skip cleanly without their library installed
# (Step 1b), so this is enough to catch a real regression without
# needing GPUs, models, or network access to any AI service.
on:
  push:
    branches: [baihe-subtitler]
  pull_request:
    branches: [baihe-subtitler]

# Read-only token: CI runs code from the PR head before anyone reviews it.
permissions:
  contents: read

# Cancel a still-running CI run for the same PR once a newer push supersedes
# it. A push to the base branch gets its own group per commit, so merges that
# land back to back don't cancel each other's post-merge run. The group is per
# workflow, so this never touches windows-installer.yml, the one workflow that
# publishes a release (it runs only for a tag or on demand); windows-bootstrap.yml
# is validation only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Real observed duration (GitHub Actions run history, 2026-09-28, 3 runs):
  # install ~20-26s, `python run_tests.py` ~5m17s-5m34s, job total
  # ~5m45s-6m13s. By 2026-09-29 the suite had grown to 9-15 min serially
  # and runs were hitting the timeout, so it now runs in parallel with
  # pytest-xdist across the runner's CPUs (the suite is xdist-safe; the
  # isolated_db fixture gives each worker its own library). By 2026-09-30
  # the parallel run took 10-15 min and one was cancelled at 94% at the old
  # 15 minute limit; 25 minutes gives headroom without letting a hung job
  # run indefinitely. The parallel run now takes about 14 minutes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-core.txt pytest pytest-xdist httpx -c constraints.txt

      # Dependabot edits the requirements floors but not constraints.txt or the
      # installer lock; this fails the PR when they stop agreeing.
      - name: Check requirements, constraints and installer lock agree
        run: python scripts/check_constraints.py

      - name: Run tests
        run: python run_tests.py -n auto

  # The React frontend: typecheck + production build, unit tests and lint.
  # The browser (Playwright) tests run in the separate four-shard `e2e` job
  # below, so this job no longer waits on them.
  #
  # Duration: this job used to include the single-process Playwright run
  # (8-9 minutes), which is why its limit is 20 minutes; the limit is
  # now only headroom against a hung install or build.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies (for the e2e API server)
        working-directory: .
        run: pip install -r requirements-core.txt -c constraints.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

  # The browser tests, split into four shards that run at the same time. Each
  # shard starts its own seeded API and library, so specs that share state keep
  # running together exactly as they did in the single-worker run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies (for the e2e API server)
        working-directory: .
        run: pip install -r requirements-core.txt -c constraints.txt

      - name: Install Node dependencies
        run: npm ci

      - name: End-to-end (shard ${{ matrix.shard }} of 4)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --shard=${{ matrix.shard }}/4
