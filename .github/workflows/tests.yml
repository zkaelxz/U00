name: Tests

# Runs the test suite against a core-only install: requirements-core.txt
# plus pytest, nothing else. Optional-dependency tests (cv2/pytesseract/
# jieba, etc.) already skip cleanly without their library installed
# (Step 1b), so this is enough to catch a real regression without
# needing GPUs, models, or network access to any AI service.
on:
  push:
    branches: [baihe-subtitler]
  pull_request:
    branches: [baihe-subtitler]

# Cancel a still-running CI run for the same branch/PR once a newer push
# supersedes it -- checked safe: this repo has no deployment/release
# workflow whose in-flight run a cancellation could interrupt, just these
# two validation workflows, so there's nothing here a mid-run cancel loses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real observed duration (GitHub Actions run history, 2026-09-28, 3 runs):
  # install ~20-26s, `python run_tests.py` ~5m17s-5m34s, job total
  # ~5m45s-6m13s. 15 minutes gives real headroom for a slow day without
  # letting a genuinely hung job run indefinitely.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-core.txt pytest httpx -c constraints.txt

      - name: Run tests
        run: python run_tests.py

  # The React frontend: typecheck + production build, unit tests, lint, and
  # the end-to-end check (a real browser -> built React -> real FastAPI on a
  # seeded throwaway library, see frontend/e2e/).
  #
  # Real observed duration: job total ~65s-108s across 3 runs, dominated by
  # the Python install (~20-23s) and the Playwright e2e step (~29-67s,
  # variable -- chromium install/launch time). 10 minutes gives real
  # headroom without leaving a hung browser/e2e step to run indefinitely.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies (for the e2e API server)
        working-directory: .
        run: pip install -r requirements-core.txt -c constraints.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: End-to-end
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
