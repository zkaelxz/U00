name: Tests

# Runs the test suite against a core-only install: requirements-core.txt
# plus pytest, nothing else. Optional-dependency tests (cv2/pytesseract/
# jieba, etc.) already skip cleanly without their library installed
#, so this is enough to catch a real regression without
# needing GPUs, models, or network access to any AI service.
on:
  push:
    branches: [baihe-subtitler]
  # The merge queue tests the queued result on a temporary branch, not a PR
  # head; `changes` runs everything for it, as for a push to the base.
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [baihe-subtitler]
    # `labeled` so adding `full-ci` starts a run that honours it.
    # `ready_for_review` starts the run that a draft skipped.
    types: [opened, synchronize, reopened, labeled, ready_for_review]

# Read-only token: CI runs code from the PR head before anyone reviews it.
permissions:
  contents: read

# Cancel a still-running CI run for the same PR once a newer push supersedes
# it. A push to the base branch gets its own group per commit, so merges that
# land back to back don't cancel each other's post-merge run. The group is per
# workflow, so this never touches windows-installer.yml, the one workflow that
# publishes a release (it runs only for a tag or on demand); windows-bootstrap.yml
# is validation only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs a change needs; the rules live in tools/ci_changes.py and are
  # tabled in docs/testing-and-ci.md. Every push to the base branch, the
  # `full-ci` label, a change to CI or dependency files, or any error in the
  # classification runs everything. A skipped job counts as passed for branch
  # protection.
  changes:
    # Every other job needs this one, so a draft PR skips them all. The merge
    # queue and pushes are never drafts.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      notes_only: ${{ steps.diff.outputs.notes_only }}
      run_e2e: ${{ steps.diff.outputs.run_e2e }}
      run_full_pytest: ${{ steps.diff.outputs.run_full_pytest }}
      run_windows_scripts: ${{ steps.diff.outputs.run_windows_scripts }}
      run_caddy: ${{ steps.diff.outputs.run_caddy }}
      run_app_checks: ${{ steps.diff.outputs.run_app_checks }}
      run_sources_subset: ${{ steps.diff.outputs.run_sources_subset }}
      pytest_shards: ${{ steps.shards.outputs.pytest_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Which jobs does this change need
        id: diff
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          all_true=$'notes_only=false\nrun_e2e=true\nrun_full_pytest=true\nrun_windows_scripts=true\nrun_caddy=true\nrun_app_checks=true\nrun_sources_subset=false'
          # The checkout is the merge commit; its first parent is the base.
          # --no-renames lists both ends of a rename, so moving a file out
          # of frontend/ still counts as touching it. tools/ci_changes.py
          # runs everything for any event but a pull request.
          out=$(git diff --name-only --no-renames HEAD^1 HEAD | python3 tools/ci_changes.py --event "$GITHUB_EVENT_NAME" --labels-json "$PR_LABELS") || out=$all_true
          # Fail open: an empty or partial answer runs everything.
          printf '%s\n' "$out" | grep -qx 'notes_only=\(true\|false\)' && \
            printf '%s\n' "$out" | grep -qx 'run_e2e=\(true\|false\)' && \
            printf '%s\n' "$out" | grep -qx 'run_full_pytest=\(true\|false\)' && \
            printf '%s\n' "$out" | grep -qx 'run_windows_scripts=\(true\|false\)' && \
            printf '%s\n' "$out" | grep -qx 'run_caddy=\(true\|false\)' && \
            printf '%s\n' "$out" | grep -qx 'run_app_checks=\(true\|false\)' && \
            printf '%s\n' "$out" | grep -qx 'run_sources_subset=\(true\|false\)' || out=$all_true
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"

      # The frontend-only subset of `test` is a few files, so it gets one job
      # instead of four runners each paying for an install.
      - name: How many pytest shards
        id: shards
        env:
          RUN_FULL_PYTEST: ${{ steps.diff.outputs.run_full_pytest }}
          RUN_SOURCES_SUBSET: ${{ steps.diff.outputs.run_sources_subset }}
        run: |
          if [ "$RUN_FULL_PYTEST" = true ] && [ "$RUN_SOURCES_SUBSET" != true ]; then
            echo 'pytest_shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"
          else
            echo 'pytest_shards=[1]' >> "$GITHUB_OUTPUT"
          fi

  # The quick guards (permissions, size allowlist, static analysis, file
  # organization, split guards, db migrations list) in about a minute, so a
  # PR that breaks a rule is red long before the full suite finishes.
  guards:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-core.txt pytest pytest-xdist httpx -c constraints.txt

      # The checked-in API types must match the routes and models; fix a
      # failure with `cd frontend/openapi-gen && npm ci`, then
      # `cd .. && npm run gen:api`, and commit the result.
      - name: Generated API types are current
        run: |
          (cd frontend/openapi-gen && npm ci)
          (cd frontend && npm run gen:api)
          git diff --exit-code -- frontend/src/api/generated

      # S113 (requests call without timeout=) lives in ruff.toml; the pinned
      # version matches .pre-commit-config.yaml.
      - name: Lint (ruff)
        run: pip install ruff==0.16.8 && ruff check . --config ruff.toml

      - name: Quick guards
        run: python run_tests.py -q -n auto $(cat tests/ci_guards.txt)

      # Fails on a type error missing from .basedpyright/baseline.json. A fixed error
      # drops out of the baseline on the run, so the diff fails until the smaller
      # baseline is committed: it can only shrink without a visible --writebaseline.
      - name: Type check (basedpyright)
        run: |
          pip install basedpyright==1.40.2
          basedpyright
          git diff --exit-code -- .basedpyright/baseline.json

      # Dependabot edits the requirements floors but not constraints.txt or the
      # installer lock; this fails the PR when they stop agreeing.
      - name: Check requirements, constraints and installer lock agree
        run: python scripts/check_constraints.py

      # The one full-suite test that reads every file in the repo, so a notes
      # file naming something the code has removed still fails before merge.
      - name: Repo-wide word scan (notes-only changes)
        if: needs.changes.outputs.notes_only == 'true'
        run: python run_tests.py -q tests/test_dub.py::TestHostedCloningRemoved::test_no_references_remain

  # The mocked suite in four shards that run at the same time. pytest-split
  # assigns whole tests to shards from the recorded durations in
  # .test_durations (refresh steps: docs/testing-and-ci.md), so the shards
  # finish together; a test missing from the file is costed at the average.
  # Every shard still runs its slice under xdist across the runner's CPUs (the
  # suite is xdist-safe; the isolated_db fixture gives each worker its own
  # library). The quick guards (permissions, size allowlist, static analysis,
  # file organization, split guards, db migrations list) run in the separate
  # `guards` job in about a minute, so a PR that breaks a rule is red long
  # before this finishes. Before sharding the single job took 12-15 minutes.
  test-shard:
    needs: changes
    if: needs.changes.outputs.notes_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.pytest_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            constraints.txt

      # The extension tests skip when `node` is missing; setting it up here keeps
      # them from going green with every test skipped if the runner image drops it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      # pytest-split and jsonschema (tests/test_e2e_fixture_schemas.py) are CI-only
      # tools, so they are pinned here, not in constraints.txt (which describes the
      # app's environment).
      - name: Install dependencies
        run: pip install -r requirements-core.txt pytest pytest-xdist "pytest-split==0.10.0" "pytest-timeout==2.4.0" "jsonschema==4.26.0" httpx -c constraints.txt

      # Tests guarded by shutil.which("ffmpeg") / ("ffprobe") skip without the
      # binaries, and the runner image does not reliably ship them. apt's
      # package cache is not worth restoring (the .debs are the small part and
      # the install needs root-owned dpkg state), so this only avoids the index
      # refresh when the image's index is still usable.
      - name: Install ffmpeg
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }

      # Tests that failed on this branch's last run go first, so a red run
      # shows its failure early. One entry per shard: a shard's cache only
      # knows its own slice. A miss falls back to the base branch's entry, or
      # to nothing, and the run is just unordered.
      - name: Restore last-failed list
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .pytest_cache
          key: pytest-lastfailed-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pytest-lastfailed-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-
            pytest-lastfailed-${{ matrix.shard }}-${{ github.base_ref || 'baihe-subtitler' }}-

      # A hung test used to stall the shard until someone cancelled it, with a
      # -q log that never named the test. The thread method works under xdist
      # and dumps every thread's stack; the crashed worker names the test.
      # The `guards` job (a required check) runs the files in tests/ci_guards.txt, so this
      # job skips them instead of running them twice.
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        if: needs.changes.outputs.run_full_pytest == 'true' && needs.changes.outputs.run_sources_subset != 'true'
        run: |
          set -o pipefail
          python run_tests.py -q -n auto --ff --durations=25 \
            --timeout=300 --timeout-method=thread \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration --durations-path .test_durations \
            $(sed 's/^/--ignore=/' tests/ci_guards.txt) 2>&1 | tee pytest.log

      # A change confined to site adapters and their tests: one shard runs the
      # adapter tests and the tests of rules every adapter must obey
      # (tools/ci_changes.py SOURCES_TEST_*). `guards` still runs on its own.
      - name: Run adapter tests
        if: needs.changes.outputs.run_sources_subset == 'true'
        run: |
          set -o pipefail
          python run_tests.py -q -n auto --ff --durations=25 \
            --timeout=300 --timeout-method=thread \
            $(python tools/ci_changes.py --sources-tests) 2>&1 | tee pytest.log

      # A change under frontend/ and docs/ only: run the tests that read
      # frontend files (so backend/frontend drift still fails) plus the
      # repo-wide word scan. `guards` runs the rest of the quick guards.
      - name: Run tests that read frontend files
        if: needs.changes.outputs.run_full_pytest != 'true'
        run: |
          set -o pipefail
          python run_tests.py -q -n auto --ff --durations=25 \
            $(python tools/ci_changes.py --frontend-tests) \
            tests/test_dub.py::TestHostedCloningRemoved::test_no_references_remain \
            $(sed 's/^/--ignore=/' tests/ci_guards.txt) 2>&1 | tee pytest.log

      # Information only: never fails the job. The wall time line shows shard
      # balance; the slowest list shows what to look at when a shard drifts.
      - name: Summarise slowest tests
        if: always()
        run: |
          {
            echo "### Shard ${{ matrix.shard }}: slowest tests"
            echo
            if [ -f pytest.log ]; then
              echo '```'
              grep -E ' in [0-9.]+s' pytest.log | tail -n 1 || true
              awk '/^=+ slowest [0-9]+ durations/{p=1;next} p&&/^=+ /{exit} p' pytest.log || true
              echo '```'
            else
              echo "No pytest log (the run did not reach pytest)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The shards install only requirements-core.txt (so a hard import of an
  # optional library still fails there), which makes every test that
  # importorskips Chinese segmentation, EPUB, Anki, audio or OpenCV skip
  # silently. This job installs those libraries and runs just those files with
  # skips reported, so a regression in them cannot merge green. torch,
  # paddleocr, Tesseract and Hugging Face models stay out: too heavy, and
  # tests/test_diarize.py needs torch, so it is left out too.
  optional-tests:
    needs: changes
    if: needs.changes.outputs.run_full_pytest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            constraints.txt

      # opencv headless: the runner has no libGL for the full wheel.
      - name: Install dependencies
        run: pip install -r requirements-core.txt pytest pytest-xdist "pytest-timeout==2.4.0" "jsonschema==4.26.0" httpx jieba pypinyin opencc-python-reimplemented ebooklib genanki soundfile opencv-contrib-python-headless -c constraints.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }

      - name: Run tests that need optional libraries
        run: |
          python run_tests.py -q -n auto -rs --timeout=300 --timeout-method=thread \
            tests/test_audio_preprocess.py tests/test_emotion_manhua_ui.py tests/test_epub_io.py \
            tests/test_export_service.py tests/test_hardsub_ocr.py tests/test_reader_service.py \
            tests/test_resegment.py tests/test_scanlate.py tests/test_scanlate_art_text.py \
            tests/test_scanlate_bench.py tests/test_scanlate_ocr_deps.py tests/test_scanlate_quality.py \
            tests/test_scanlate_regions.py tests/test_segment.py tests/test_transcription_quality.py \
            tests/test_video_export.py tests/test_vocab_export.py

  # The one required check name. It stays `test` so branch protection does not
  # change: it passes when every shard passed or the whole matrix was skipped
  # (a notes-only change), and fails if any shard failed or was cancelled, or
  # if `changes` itself failed. `windows-scripts` and `e2e` are held to the
  # same rule: skipped is fine (the change touched no Windows script or
  # frontend), failed or cancelled is not, so a red browser shard blocks merge.
  test:
    needs: [changes, guards, frontend, test-shard, optional-tests, windows-scripts, e2e, smoke, caddy]
    # Skipped with its needs on a draft: a draft cannot be merged, and marking
    # it ready starts a full run.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Every shard passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          GUARDS: ${{ needs.guards.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SHARDS: ${{ needs.test-shard.result }}
          OPTIONAL: ${{ needs.optional-tests.result }}
          WINDOWS_SCRIPTS: ${{ needs.windows-scripts.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
          CADDY: ${{ needs.caddy.result }}
        run: |
          echo "changes=$CHANGES guards=$GUARDS frontend=$FRONTEND test-shard=$SHARDS optional-tests=$OPTIONAL windows-scripts=$WINDOWS_SCRIPTS e2e=$E2E smoke=$SMOKE caddy=$CADDY"
          [ "$CHANGES" = success ] || exit 1
          [ "$GUARDS" = success ] || [ "$GUARDS" = skipped ] || exit 1
          [ "$FRONTEND" = success ] || [ "$FRONTEND" = skipped ] || exit 1
          [ "$SHARDS" = success ] || [ "$SHARDS" = skipped ] || exit 1
          [ "$OPTIONAL" = success ] || [ "$OPTIONAL" = skipped ] || exit 1
          [ "$WINDOWS_SCRIPTS" = success ] || [ "$WINDOWS_SCRIPTS" = skipped ] || exit 1
          [ "$E2E" = success ] || [ "$E2E" = skipped ] || exit 1
          [ "$SMOKE" = success ] || [ "$SMOKE" = skipped ] || exit 1
          [ "$CADDY" = success ] || [ "$CADDY" = skipped ] || exit 1

  # The real server, not the mocked suite: tools/smoke_test.py starts
  # `python -m api` on a throwaway data folder and runs the owner's main flows
  # over HTTP (create a title, transcribe with tiny Whisper on the CPU,
  # translate with Echo, edit, SRT export, backup and restore, cancel a job,
  # member refused an admin route). It is in `test`'s needs, so a red smoke
  # blocks merge, and a v0.1.0 tag is not cut over one. It needs no key, GPU or
  # paid engine; the only download is the 75 MB tiny model, cached below.
  # Skipped for a notes-only change, which cannot change what the app does.
  # Runtime: about a minute of install plus under a minute of test on a warm
  # cache; the step limit is the "under 5 minutes" budget.
  smoke:
    needs: changes
    if: needs.changes.outputs.notes_only != 'true' && needs.changes.outputs.run_app_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            constraints.txt

      # The floor matches requirements-media.txt; nothing else from it is used.
      - name: Install dependencies
        run: pip install -r requirements-core.txt "faster-whisper>=1.2.1" -c constraints.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }

      # Keyed on the model pins: a moved revision downloads again.
      - name: Cache the tiny Whisper model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .hf-cache
          key: smoke-whisper-tiny-${{ hashFiles('model_pins.py') }}

      - name: Real-app smoke test
        timeout-minutes: 5
        run: python -m tools.smoke_test

  # The household Caddyfile through a real Caddy: the same pinned build the
  # installer bundles (installer/caddy, Go from build_installer.CADDY_GO_VERSION,
  # every module checked against go.sum), then tools/caddy_check.py renders the
  # template as Setup does, runs `caddy validate`, serves it on a local HTTP port
  # and checks that uncleaned paths (a backslash among them) get 400.
  # tests/test_caddyfile_template.py reads the template with a small parser;
  # this proves Caddy reads it the same way. Only when `changes` says the
  # template, its rendering or the Caddy build changed. About two minutes.
  caddy:
    needs: changes
    if: needs.changes.outputs.run_caddy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # go.dev's published hash for this archive.
      GO_URL: "https://go.dev/dl/go1.26.9.linux-amd64.tar.gz"
      GO_SHA256: "42d158b4d8f7b61ac0a830567c940a86098fb7aac52e467a5ebec03ef5cc2f8d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the bundled Caddy
        run: |
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/go.tar.gz" "$GO_URL"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tar.gz"
          cd installer/caddy
          GOFLAGS=-mod=readonly GOTOOLCHAIN=local CGO_ENABLED=0 \
            "$RUNNER_TEMP/go/bin/go" build -trimpath -buildvcs=false -o "$RUNNER_TEMP/caddy" .
          "$RUNNER_TEMP/caddy" list-modules | grep -qx 'http.handlers.rate_limit'

      - name: The rendered Caddyfile validates and refuses uncleaned paths
        timeout-minutes: 3
        run: python tools/caddy_check.py --caddy "$RUNNER_TEMP/caddy"

  # Runs the Windows scripts (setup.bat, start.bat up to the server launch,
  # uninstall.bat) in temp folders with their prompts answered through stdin,
  # and a library backup-and-restore round trip in the installed copy;
  # tools/windows_script_checks.py has the cases and docs/testing-and-ci.md
  # the list of what this does and does not prove. Only when `changes` says a
  # script, installer/, the restore code or this workflow changed (tools/ci_changes.py). The
  # dependency install is the same pip install start.bat --ci does in
  # windows-bootstrap.yml; nothing else is downloaded. windows-latest bills at
  # 2x, hence the path filter and the timeout. No secrets are used.
  windows-scripts:
    needs: changes
    if: needs.changes.outputs.run_windows_scripts == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # cache: pip keeps pip's download cache between runs, which the venv
      # that start.bat creates also uses, so a warm run downloads little.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            constraints.txt

      - name: setup.bat reports and installs nothing
        run: python tools/windows_script_checks.py setup

      - name: start.bat installs, upgrades over a library with data, then a restore round trip
        run: python tools/windows_script_checks.py install

      - name: uninstall.bat prompts, library rule and leftovers
        run: python tools/windows_script_checks.py uninstall

  # The React frontend: typecheck + production build, unit tests and lint.
  # The browser (Playwright) tests run in the separate four-shard `e2e` job
  # below, so this job no longer waits on them.
  #
  # Duration: this job used to include the single-process Playwright run
  # (8-9 minutes), which is why its limit is 20 minutes; the limit is
  # now only headroom against a hung install or build.
  frontend:
    needs: changes
    if: needs.changes.outputs.notes_only != 'true' && needs.changes.outputs.run_app_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

  # The browser tests, split into four shards that run at the same time. Each
  # shard starts its own seeded API and library, so specs that share state keep
  # running together exactly as they did in the single-worker run.
  e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            constraints.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # review-stage.spec.ts writes its test video with OpenCV and skips three
      # tests without it. Headless: the runner has no display libraries, and
      # the floor matches requirements-media.txt.
      - name: Install Python dependencies (for the e2e API server)
        working-directory: .
        run: pip install -r requirements-core.txt "opencv-python-headless>=4.8.1.78" -c constraints.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Built here rather than by the web server commands, whose start-up timeout a slow build once ran out.
      - name: Build the app and the Catalogue build
        run: |
          npm run build
          BAIHE_E2E_CATALOGUE=1 npx vite build --outDir dist-catalogue --emptyOutDir

      # No --with-deps: ubuntu-latest already carries Chromium's system libraries.
      - name: End-to-end (shard ${{ matrix.shard }} of 4)
        env:
          E2E_PREBUILT: '1'
        run: |
          npx playwright install chromium
          npx playwright test --shard=${{ matrix.shard }}/4

      # Playwright counts a skipped test as passed; this fails on any skip not on frontend/e2e/skip-allowlist.json.
      - name: Fail on unexpected skipped tests
        working-directory: .
        run: python tools/check_e2e_skips.py frontend/test-results/results.json

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
