name: Installer end-to-end

# The installer and the in-app update, end to end on a clean Windows runner,
# because the test PCs can't make a throwaway user to install into. Builds
# BaiheStudio-Setup-90.0.0.exe from the ref under test (the build steps of
# windows-installer.yml), then:
#   1. fresh install: silent Setup into temp folders, the app answers, uninstall;
#   2. update: the latest published release (or the base branch's build when
#      there is none) is installed, a title with lines is seeded, and the old
#      copy's own updater checks, downloads, verifies and runs silent Setup
#      (update_service.install(silent=True)) against a fake GitHub; the app
#      comes back as 90.0.0 with the title and lines intact;
#   3. a failed check is retried at the next start, and a good one clears it;
#   4. stale downloads and their first-verified records go at start, newer
#      ones stay, and a newer download keeps its first-verified time across a
#      restart;
#   5. the launcher says why the server refused to start: a damaged library,
#      and a library a newer version opened.
# The fake GitHub (installer/e2e_check.py serve) is an HTTPS proxy only the
# app's processes use (HTTPS_PROXY), with a throwaway CA only they trust
# (REQUESTS_CA_BUNDLE); the updater code is unchanged. Releases are signed
# with a throwaway key made on the runner, whose public half replaces the
# installed copy's release_public_key.txt: no repository secret is used.
# Checks for a feature the ref doesn't have yet (the update and launcher
# changes land in separate PRs) are skipped with a notice, never passed.
#
# windows-latest bills at 2x, so pull requests run it only when the
# installer, the updater or this test changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test"
        required: false
        default: "baihe-subtitler"
  pull_request:
    branches: [baihe-subtitler]
    # Once the merge is approved, as windows-bootstrap.yml does: a 2x-billed Windows job on
    # every draft push would hold the other PRs' jobs back under the 20-job limit.
    types: [opened, synchronize, reopened, labeled, ready_for_review, auto_merge_enabled]
    paths:
      - "installer/**"
      - "services/update_service.py"
      - "services/app_update_service.py"
      - ".github/workflows/installer-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  installer-e2e:
    if: >-
      github.event_name != 'pull_request' || (!github.event.pull_request.draft &&
      (github.event.pull_request.auto_merge != null || github.event.action == 'auto_merge_enabled' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      INNO_URL: "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
      INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
      GO_URL: "https://go.dev/dl/go1.26.11.windows-amd64.zip"
      GO_SHA256: "71ae086f0137e665f855a811cc119152b6a783e0bbc1b906e709f46d80141eb0"
      # Far above any real release, so the update is always "newer".
      NEW_VERSION: "90.0.0"
      NEWER_VERSION: "91.0.0"
      E2E_REPO: "example-owner/baihe-e2e"
      E2E_PROXY_PORT: "18443"
      DAMAGED_SENTENCE: "The library database (library.db in the library folder) is damaged, so Baihe can't open it."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Which features this ref has
        run: |
          $update = Select-String -Path services/update_service.py -Pattern 'update.last_check_failed' -SimpleMatch -Quiet
          $launcher = Select-String -Path installer/launcher.py -Pattern 'def take_start_refusal' -SimpleMatch -Quiet
          "HAS_UPDATE_RETRY=$([int][bool]$update)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HAS_START_REFUSAL=$([int][bool]$launcher)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Failed-check retry and first-verified records: $([bool]$update); launcher shows the refusal: $([bool]$launcher)"

      - name: Install Inno Setup (pinned)
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $exe -TimeoutSec 300
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { Write-Error "Inno Setup hash $hash != $env:INNO_SHA256"; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup6"
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Inno Setup install exited $($p.ExitCode)"; exit 1 }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Go (pinned)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "go.zip"
          Invoke-WebRequest -Uri $env:GO_URL -OutFile $zip -TimeoutSec 300
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GO_SHA256) { Write-Error "Go hash $hash != $env:GO_SHA256"; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP "go-dist"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          tar -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { Write-Error "couldn't unpack Go"; exit 1 }
          "GO_EXE=$dir\go\bin\go.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the installer under test
        run: |
          python installer/build_installer.py --version "$env:NEW_VERSION" --iscc "$env:ISCC" --go "$env:GO_EXE"
          if ($LASTEXITCODE -ne 0) { Write-Error "the build failed"; exit 1 }
          $setup = Get-ChildItem "build/installer/output/BaiheStudio-Setup-$env:NEW_VERSION.exe" | Select-Object -First 1
          if (-not $setup) { Write-Error "no BaiheStudio-Setup-$env:NEW_VERSION.exe"; exit 1 }
          "NEW_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 1. Fresh install answers, then uninstalls
        run: |
          $app = Join-Path $env:RUNNER_TEMP "fresh-app"
          $data = Join-Path $env:RUNNER_TEMP "fresh-data"
          $log = Join-Path $env:RUNNER_TEMP "setup-fresh.log"
          $p = Start-Process -FilePath $env:NEW_SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!service","/DIR=`"$app`"","/DATADIR=`"$data`"","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Setup exited $($p.ExitCode)"; exit 1 }
          & "$app\python\python.exe" -s "$app\app\installer\launcher.py" --no-browser
          if ($LASTEXITCODE -ne 0) { Write-Error "launcher --no-browser exited $LASTEXITCODE"; exit 1 }
          $health = Invoke-WebRequest -Uri http://127.0.0.1:8600/api/health -UseBasicParsing -TimeoutSec 10
          if ($health.StatusCode -ne 200) { Write-Error "/api/health answered $($health.StatusCode)"; exit 1 }
          python installer/e2e_check.py wait-status --field current --equals $env:NEW_VERSION --timeout 30
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Invoke-WebRequest -Uri http://127.0.0.1:8600/api/library/dramas -UseBasicParsing -TimeoutSec 30 | Out-Null
          if (-not (Test-Path "$data\library\library.db")) { Write-Error "library.db is not in the data folder"; exit 1 }
          $out = & "$app\python\python.exe" -s "$app\app\installer\launcher.py" --stop
          if ("$out" -notlike "*clean shutdown*") { Write-Error "expected a clean shutdown, got: $out"; exit 1 }
          $p = Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Uninstall exited $($p.ExitCode)"; exit 1 }
          for ($i = 0; $i -lt 120 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\unins000.exe") { Write-Error "the uninstall didn't finish"; exit 1 }
          Write-Host "Fresh install of $env:NEW_VERSION answered on /api/health and uninstalled."

      # Before the fake GitHub is in any environment: this is the real one.
      - name: Get the previous release's installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "base-setup"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            Write-Host "::notice::No published release; the base branch's installer is built instead."
            "BASE_FROM_SOURCE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $v = $tag.TrimStart("v")
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $dir --pattern "BaiheStudio-Setup-$v.exe" --pattern "BaiheStudio-Setup-$v.exe.sha256"
          if ($LASTEXITCODE -ne 0) { Write-Error "couldn't download $tag's installer"; exit 1 }
          $exe = Join-Path $dir "BaiheStudio-Setup-$v.exe"
          $want = ((Get-Content "$exe.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { Write-Error "$tag's installer is $got, its .sha256 says $want"; exit 1 }
          "BASE_SETUP=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Previous release: $tag, sha256 $got"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.BASE_FROM_SOURCE == '1'
        with:
          ref: ${{ github.event.pull_request.base.sha || 'baihe-subtitler' }}
          path: base-src
          persist-credentials: false

      - name: Build the base branch's installer (no published release)
        if: env.BASE_FROM_SOURCE == '1'
        run: |
          python base-src/installer/build_installer.py --version 89.0.0 --iscc "$env:ISCC" --go "$env:GO_EXE"
          if ($LASTEXITCODE -ne 0) { Write-Error "the base build failed"; exit 1 }
          $exe = (Get-ChildItem base-src/build/installer/output/BaiheStudio-Setup-89.0.0.exe).FullName
          "BASE_SETUP=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_VERSION=89.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fake GitHub with a throwaway CA and release key
        run: |
          python -m pip install --disable-pip-version-check -q "cryptography==50.0.2"
          if ($LASTEXITCODE -ne 0) { Write-Error "couldn't install cryptography"; exit 1 }
          $tls = Join-Path $env:RUNNER_TEMP "e2e-tls"
          $key = Join-Path $env:RUNNER_TEMP "e2e-key"
          $gh = Join-Path $env:RUNNER_TEMP "e2e-github"
          python installer/e2e_check.py certs $tls
          python installer/e2e_check.py keygen $key
          python installer/e2e_check.py publish --root $gh --repo $env:E2E_REPO --version $env:NEW_VERSION --file $env:NEW_SETUP --key "$key\test_release_private_key.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = Join-Path $env:RUNNER_TEMP "fake-github.log"
          $pidFile = Join-Path $env:RUNNER_TEMP "fake-github.pid"
          # Started through WMI, outside this step's job object, which the
          # runner ends with the step; the app's own server leaves it the same way.
          $cmd = "cmd.exe /s /c `"`"$((Get-Command python).Source)`" -u `"$env:GITHUB_WORKSPACE\installer\e2e_check.py`" serve --root `"$gh`" --repo $env:E2E_REPO --cert `"$tls\leaf.pem`" --key `"$tls\leaf.key`" --port $env:E2E_PROXY_PORT --pid-file `"$pidFile`" >> `"$log`" 2>&1`""
          "FAKE_GITHUB_CMD=$cmd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmd; CurrentDirectory = $env:GITHUB_WORKSPACE }
          if ($r.ReturnValue -ne 0) { Write-Error "couldn't start the fake GitHub ($($r.ReturnValue))"; exit 1 }
          for ($i = 0; $i -lt 30 -and -not (Get-NetTCPConnection -State Listen -LocalPort $env:E2E_PROXY_PORT -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Get-NetTCPConnection -State Listen -LocalPort $env:E2E_PROXY_PORT -ErrorAction SilentlyContinue)) { if (Test-Path $log) { Get-Content $log }; Write-Error "the fake GitHub didn't start"; exit 1 }
          # From here on every step, so every app start and the Setup the app
          # starts, reaches only the fake GitHub.
          @("FAKE_GITHUB_PID_FILE=$pidFile", "FAKE_GITHUB_LOG=$log",
            "E2E_GITHUB=$gh", "E2E_KEY=$key",
            "HTTPS_PROXY=http://127.0.0.1:$env:E2E_PROXY_PORT", "NO_PROXY=127.0.0.1,localhost",
            "REQUESTS_CA_BUNDLE=$tls\ca.pem", "BAIHE_UPDATE_REPO=$env:E2E_REPO") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 2. Install the previous release and seed a title
        run: |
          $app = Join-Path $env:RUNNER_TEMP "e2e-app"
          $data = Join-Path $env:RUNNER_TEMP "e2e-data"
          @("E2E_APP=$app", "E2E_DATA=$data", "E2E_DB=$data\library\library.db") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $log = Join-Path $env:RUNNER_TEMP "setup-base.log"
          $p = Start-Process -FilePath $env:BASE_SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/MERGETASKS=!service","/DIR=`"$app`"","/DATADIR=`"$data`"","/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Setup $env:BASE_VERSION exited $($p.ExitCode)"; exit 1 }
          # The copy checks signatures with the throwaway key, as a real one does with the project's.
          Copy-Item "$env:E2E_KEY\release_public_key.txt" "$app\app\installer\release_public_key.txt" -Force
          & "$app\python\python.exe" -s "$app\app\installer\launcher.py" --no-browser
          if ($LASTEXITCODE -ne 0) { Write-Error "launcher --no-browser exited $LASTEXITCODE"; exit 1 }
          python installer/e2e_check.py wait-status --field current --equals $env:BASE_VERSION --timeout 30
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Invoke-WebRequest -Uri http://127.0.0.1:8600/api/library/dramas -UseBasicParsing -TimeoutSec 30 | Out-Null
          $id = & "$app\python\python.exe" -s installer/e2e_check.py seed --app "$app\app"
          if ($LASTEXITCODE -ne 0) { Write-Error "couldn't seed a title"; exit 1 }
          $id = [int]($id | Select-Object -Last 1)
          "SEED_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$app\python\python.exe" -s installer/e2e_check.py verify-seed --app "$app\app" --id $id
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Setup's backup gate: without the app-only update's manifest the
          # schema change is unknown, so a recent backup is needed (as for a user).
          & "$app\python\python.exe" -s installer/e2e_check.py backup --app "$app\app"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 2. The old copy's updater checks, downloads, verifies and runs silent Setup
        run: |
          # A process of its own: install(silent=True) is what the automatic
          # update calls; the Install button's route opens Setup's window, which
          # needs a click. It exits as soon as Setup has started.
          $out = & "$env:E2E_APP\python\python.exe" -s installer/e2e_check.py update --app "$env:E2E_APP\app" --version $env:NEW_VERSION
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { Write-Error "the updater failed"; exit 1 }
          $setupPid = ([string]($out | Select-Object -Last 1) | ConvertFrom-Json).setup_pid
          $setup = Get-Process -Id $setupPid -ErrorAction SilentlyContinue
          if ($setup) { if (-not $setup.WaitForExit(900000)) { Write-Error "Setup didn't finish in 15 minutes"; exit 1 } }
          # /RESTARTAPP=1: Setup starts the app again by itself.
          python installer/e2e_check.py wait-status --field current --equals $env:NEW_VERSION --timeout 300
          if ($LASTEXITCODE -ne 0) { Write-Error "the app didn't come back as $env:NEW_VERSION"; exit 1 }
          & "$env:E2E_APP\python\python.exe" -s installer/e2e_check.py verify-seed --app "$env:E2E_APP\app" --id $env:SEED_ID
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # No longer newer than this copy, so the start's sweep removes it.
          $old = "$env:E2E_DATA\library\updates\BaiheStudio-Setup-$env:NEW_VERSION.exe"
          for ($i = 0; $i -lt 60 -and (Test-Path $old); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $old) { Write-Error "the installed update's download is still in updates\"; exit 1 }
          # Setup put the project's key back; the tests below sign with the throwaway one.
          Copy-Item "$env:E2E_KEY\release_public_key.txt" "$env:E2E_APP\app\installer\release_public_key.txt" -Force
          Write-Host "Updated $env:BASE_VERSION -> $env:NEW_VERSION through the app's own updater; the seeded title and lines survived."

      - name: 3. A failed check is retried at the next start
        if: env.HAS_UPDATE_RETRY == '1'
        run: |
          $py = "$env:E2E_APP\python\python.exe"; $launcher = "$env:E2E_APP\app\installer\launcher.py"
          function Restart-App { & $py -s $launcher --stop | Out-Null; & $py -s $launcher --no-browser; if ($LASTEXITCODE -ne 0) { Write-Error "launcher exited $LASTEXITCODE"; exit 1 } }
          function Start-Fake {
            $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $env:FAKE_GITHUB_CMD; CurrentDirectory = $env:GITHUB_WORKSPACE }
            if ($r.ReturnValue -ne 0) { Write-Error "couldn't restart the fake GitHub"; exit 1 }
            for ($i = 0; $i -lt 30 -and -not (Get-NetTCPConnection -State Listen -LocalPort $env:E2E_PROXY_PORT -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
            if (-not (Get-NetTCPConnection -State Listen -LocalPort $env:E2E_PROXY_PORT -ErrorAction SilentlyContinue)) { Write-Error "the fake GitHub didn't restart"; exit 1 } }
          # The source goes dead: nothing answers at the proxy's address.
          Stop-Process -Id ([int](Get-Content $env:FAKE_GITHUB_PID_FILE)) -Force
          for ($i = 0; $i -lt 15 -and (Get-NetTCPConnection -State Listen -LocalPort $env:E2E_PROXY_PORT -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          if (Get-NetTCPConnection -State Listen -LocalPort $env:E2E_PROXY_PORT -ErrorAction SilentlyContinue) { Write-Error "the fake GitHub is still listening"; exit 1 }
          python installer/e2e_check.py api POST /api/system/update/check
          python installer/e2e_check.py wait-setting $env:E2E_DB update.last_check_failed --equals true --timeout 10
          if ($LASTEXITCODE -ne 0) { Write-Error "a failed check didn't set update.last_check_failed"; exit 1 }
          # Set to now, so the daily schedule can't fire: only the start's own check can move it.
          & $py -s $launcher --stop | Out-Null
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          python installer/e2e_check.py setting $env:E2E_DB update.last_check_at --set $now
          & $py -s $launcher --no-browser
          if ($LASTEXITCODE -ne 0) { Write-Error "launcher exited $LASTEXITCODE"; exit 1 }
          # Failed again (still dead): the next try is set an hour on, i.e. 23 h "ago".
          python installer/e2e_check.py wait-setting $env:E2E_DB update.last_check_at --below ($now - 22 * 3600) --timeout 60
          if ($LASTEXITCODE -ne 0) { Write-Error "no check ran at start after a failed one"; exit 1 }
          python installer/e2e_check.py wait-setting $env:E2E_DB update.last_check_failed --equals true --timeout 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The source is good again: the next start's check clears the flag by itself.
          Start-Fake
          $before = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          Restart-App
          python installer/e2e_check.py wait-setting $env:E2E_DB update.last_check_failed --equals false --timeout 60
          if ($LASTEXITCODE -ne 0) { Write-Error "a good check at start didn't clear update.last_check_failed"; exit 1 }
          python installer/e2e_check.py wait-setting $env:E2E_DB update.last_check_at --above ($before - 5) --timeout 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # After a good check the daily schedule stands: no check at the next start.
          $at = python installer/e2e_check.py setting $env:E2E_DB update.last_check_at
          Restart-App
          Start-Sleep -Seconds 20
          $after = python installer/e2e_check.py setting $env:E2E_DB update.last_check_at
          if ("$after" -ne "$at") { Write-Error "a start after a good check checked again ($at -> $after)"; exit 1 }
          Write-Host "Failed check flagged; retried at start (failed, then good); the flag cleared; no extra check after."

      - name: 4. Stale downloads go at start, a newer one stays
        run: |
          $py = "$env:E2E_APP\python\python.exe"; $launcher = "$env:E2E_APP\app\installer\launcher.py"
          $updates = "$env:E2E_DATA\library\updates"
          & $py -s $launcher --stop | Out-Null
          New-Item -ItemType Directory -Force -Path $updates | Out-Null
          $stale = @("BaiheStudio-Setup-$env:NEW_VERSION.exe", "BaiheStudio-Setup-$env:BASE_VERSION.exe", "BaiheStudio-App-$env:BASE_VERSION.zip", "BaiheStudio-Setup-$env:NEWER_VERSION.exe.part")
          $newer = "BaiheStudio-Setup-$env:NEWER_VERSION.exe"
          foreach ($f in $stale + $newer) { Set-Content -Path (Join-Path $updates $f) -Value "planted" }
          if ($env:HAS_UPDATE_RETRY -eq '1') {
            $sha = "0" * 64; $t = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - 600
            python installer/e2e_check.py setting $env:E2E_DB update.installer_first_verified --set "{`"version`": `"$env:NEW_VERSION`", `"name`": `"BaiheStudio-Setup-$env:NEW_VERSION.exe`", `"sha256`": `"$sha`", `"at`": $t}"
            python installer/e2e_check.py setting $env:E2E_DB update.app_first_verified --set "{`"version`": `"$env:BASE_VERSION`", `"name`": `"BaiheStudio-App-$env:BASE_VERSION.zip`", `"sha256`": `"$sha`", `"at`": $t}"
          } else { Write-Host "::notice::This ref has no first-verified records; only the files are checked." }
          & $py -s $launcher --no-browser
          if ($LASTEXITCODE -ne 0) { Write-Error "launcher exited $LASTEXITCODE"; exit 1 }
          for ($i = 0; $i -lt 60 -and ($stale | Where-Object { Test-Path (Join-Path $updates $_) }); $i++) { Start-Sleep -Seconds 1 }
          $left = @($stale | Where-Object { Test-Path (Join-Path $updates $_) })
          if ($left) { Write-Error "still in updates\ after a start: $($left -join ', ')"; exit 1 }
          if (-not (Test-Path (Join-Path $updates $newer))) { Write-Error "the start removed the newer $newer"; exit 1 }
          if ($env:HAS_UPDATE_RETRY -eq '1') {
            foreach ($k in @("update.installer_first_verified", "update.app_first_verified")) {
              python installer/e2e_check.py wait-setting $env:E2E_DB $k --equals null --timeout 30
              if ($LASTEXITCODE -ne 0) { Write-Error "the stale $k record was kept"; exit 1 }
            }
          }
          Write-Host "Stale downloads (and records) went at start; $newer stayed."

      - name: 4. A newer download keeps its first-verified time across a restart
        if: env.HAS_UPDATE_RETRY == '1'
        run: |
          $py = "$env:E2E_APP\python\python.exe"; $launcher = "$env:E2E_APP\app\installer\launcher.py"
          # The installer under test again, published as the newer version (its
          # name is part of what is signed). It is downloaded, never installed.
          python installer/e2e_check.py publish --root $env:E2E_GITHUB --repo $env:E2E_REPO --version $env:NEWER_VERSION --file $env:NEW_SETUP --key "$env:E2E_KEY\test_release_private_key.txt"
          python installer/e2e_check.py api POST /api/system/update/check --expect 200
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python installer/e2e_check.py api POST /api/system/update/download --expect 202
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python installer/e2e_check.py wait-download --version $env:NEWER_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $first = python installer/e2e_check.py setting $env:E2E_DB update.installer_first_verified | ConvertFrom-Json
          if ($first.version -ne $env:NEWER_VERSION -or -not $first.at) { Write-Error "no first-verified record for $env:NEWER_VERSION"; exit 1 }
          Start-Sleep -Seconds 2
          & $py -s $launcher --stop | Out-Null
          & $py -s $launcher --no-browser
          if ($LASTEXITCODE -ne 0) { Write-Error "launcher exited $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path "$env:E2E_DATA\library\updates\BaiheStudio-Setup-$env:NEWER_VERSION.exe")) { Write-Error "the start removed the newer download"; exit 1 }
          python installer/e2e_check.py api POST /api/system/update/check --expect 200
          python installer/e2e_check.py api POST /api/system/update/download --expect 202
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python installer/e2e_check.py wait-download --version $env:NEWER_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $again = python installer/e2e_check.py setting $env:E2E_DB update.installer_first_verified | ConvertFrom-Json
          if ($again.at -ne $first.at) { Write-Error "the first-verified time moved across the restart: $($first.at) -> $($again.at)"; exit 1 }
          Write-Host "Verified $env:NEWER_VERSION first at $($first.at); after a restart and a new download it is still $($again.at)."
          # The Install button's route: it starts Setup's window, which waits
          # for a click that can't happen here, so the test only checks that
          # Setup started and the app kept running, then closes it.
          $r = python installer/e2e_check.py api POST /api/system/update/install --body '{"confirm": true}' --expect 200
          Write-Host $r
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ($r | ConvertFrom-Json).body.launched) { Write-Error "Install didn't report Setup started"; exit 1 }
          $setup = @()
          for ($i = 0; $i -lt 30 -and -not $setup; $i++) {
            Start-Sleep -Seconds 1
            $setup = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath -match 'baihe_setup_|BaiheStudio-Setup-' -and $_.ExecutablePath -notlike "$env:RUNNER_TEMP*" })
          }
          if (-not $setup) { Write-Error "no Setup process after Install"; exit 1 }
          $setup | Format-Table ProcessId, ExecutablePath
          Start-Sleep -Seconds 5
          $health = Invoke-WebRequest -Uri http://127.0.0.1:8600/api/health -UseBasicParsing -TimeoutSec 10
          if ($health.StatusCode -ne 200) { Write-Error "the app stopped before anyone clicked Install in Setup"; exit 1 }
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath -match 'baihe_setup_|BaiheStudio-Setup-' -and $_.ExecutablePath -notlike "$env:RUNNER_TEMP*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "Install started Setup ($($setup.Count) process(es)); the app kept running until Setup's own click; Setup closed."

      - name: 5. The launcher says why the server refused to start
        run: |
          $py = "$env:E2E_APP\python\python.exe"; $launcher = "$env:E2E_APP\app\installer\launcher.py"
          $serverLog = "$env:E2E_DATA\launcher\server.log"
          function Test-Refusal($sentence) {
            $from = if (Test-Path $serverLog) { (Get-Item $serverLog).Length } else { 0 }
            $out = (& $py -s $launcher --no-browser 2>&1) | Out-String
            $code = $LASTEXITCODE
            Write-Host "launcher (exit $code): $out"
            if ($code -ne 1) { Write-Error "the launcher exited $code, expected 1"; exit 1 }
            $fs = [IO.File]::Open($serverLog, 'Open', 'Read', 'ReadWrite'); $fs.Seek($from, 'Begin') | Out-Null
            $new = (New-Object IO.StreamReader($fs)).ReadToEnd(); $fs.Close()
            if (-not $new.Contains($sentence)) { Write-Host $new; Write-Error "server.log doesn't give the reason: $sentence"; exit 1 }
            if ($env:HAS_START_REFUSAL -eq '1') {
              if (-not $out.Contains($sentence)) { Write-Error "the launcher's message doesn't give the reason: $sentence"; exit 1 }
            } else { Write-Host "::notice::This ref's launcher doesn't show the server's reason; only server.log is checked." }
          }
          & $py -s $launcher --stop | Out-Null
          $saved = Join-Path $env:RUNNER_TEMP "library.db.saved"
          Copy-Item $env:E2E_DB $saved -Force
          # A damaged library: cut to its first 4 KB.
          $fs = [IO.File]::Open($env:E2E_DB, 'Open', 'ReadWrite'); $fs.SetLength(4096); $fs.Close()
          Remove-Item "$env:E2E_DB-wal", "$env:E2E_DB-shm" -ErrorAction SilentlyContinue
          Test-Refusal $env:DAMAGED_SENTENCE
          # A library a newer version opened.
          Copy-Item $saved $env:E2E_DB -Force
          python installer/e2e_check.py setting $env:E2E_DB app_version_last_opened --set '"999.0.0"'
          Test-Refusal "This library was last opened by Baihe 999.0.0, but this is Baihe $env:NEW_VERSION."
          # Put back, it starts again.
          Copy-Item $saved $env:E2E_DB -Force
          & $py -s $launcher --no-browser
          if ($LASTEXITCODE -ne 0) { Write-Error "the restored library didn't start"; exit 1 }
          & $py -s installer/e2e_check.py verify-seed --app "$env:E2E_APP\app" --id $env:SEED_ID
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Logs on failure
        if: failure() || cancelled()
        run: |
          foreach ($f in @("$env:RUNNER_TEMP\setup-fresh.log", "$env:RUNNER_TEMP\setup-base.log", "$env:FAKE_GITHUB_LOG", "$env:E2E_DATA\launcher\install.log", "$env:E2E_DATA\launcher\server.log", "$env:E2E_DATA\library\logs\app.log")) {
            if ($f -and (Test-Path $f)) { Write-Host "===== $f"; Get-Content $f -Tail 200 }
          }
          Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "===== $($_.FullName)"; Get-Content $_.FullName -Tail 200 }

      - name: Stop the app and the fake GitHub
        if: always()
        run: |
          if ($env:E2E_APP -and (Test-Path "$env:E2E_APP\app\installer\launcher.py")) { & "$env:E2E_APP\python\python.exe" -s "$env:E2E_APP\app\installer\launcher.py" --stop }
          if ($env:FAKE_GITHUB_PID_FILE -and (Test-Path $env:FAKE_GITHUB_PID_FILE)) { Stop-Process -Id ([int](Get-Content $env:FAKE_GITHUB_PID_FILE)) -Force -ErrorAction SilentlyContinue }
