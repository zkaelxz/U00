name: Dependency audit

# Weekly scan for known vulnerabilities in the declared dependencies. Kept out
# of the PR checks on purpose: a new advisory against a package a PR never
# touched would turn unrelated PRs red. A failure here means "look at the
# advisory", not "this change is broken".
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      # The tier files are audited separately because requirements.txt is only
      # their union; each run resolves the full dependency tree, not just the
      # listed names, so transitive advisories are caught too.
      - name: Audit requirements
        run: |
          pip-audit -r requirements-core.txt
          pip-audit -r requirements-media.txt
          pip-audit -r requirements-optional.txt

      # What the installer really ships: the hash-pinned wheels (pip and every
      # transitive dependency) can differ from what the tier files resolve to today.
      - name: Audit the installer's wheel set
        # The lock holds win_amd64 hashes only; --disable-pip audits it without installing on Linux.
        run: pip-audit --disable-pip -r installer/wheels.lock.txt

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      # Dev-only packages (vite, playwright, ...) never ship in the built app.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Never shipped either, but it runs on the PC whenever the API types are
      # regenerated, so all of it is audited.
      - name: Audit the API type generator
        working-directory: frontend/openapi-gen
        run: npm audit

  # The Caddy build the installer bundles: the one part that faces the internet.
  # govulncheck reports only advisories whose code the build can reach.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # go.dev's published hash for this archive (the same Go as tests.yml's caddy job).
      GO_URL: "https://go.dev/dl/go1.26.10.linux-amd64.tar.gz"
      GO_SHA256: "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the Caddy build
        run: |
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/go.tar.gz" "$GO_URL"
          echo "$GO_SHA256  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tar.gz"
          cd installer/caddy
          GOFLAGS=-mod=readonly GOTOOLCHAIN=local \
            "$RUNNER_TEMP/go/bin/go" run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Gradle has no lockfile to audit, so the Android app's resolved dependencies
  # (the build plugin included) go to GitHub's dependency graph, and advisories
  # against them appear as Dependabot alerts. Resolving runs the build scripts,
  # so that job gets no write access; only the job that uploads the graph does.
  gradle-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          build-root-directory: android
          dependency-graph: generate-and-upload

  gradle-submit:
    needs: gradle-graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          dependency-graph: download-and-submit
